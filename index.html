<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StormSignal | Chaminade Weather</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--red:#e31818;--light:#f6f6f6;--border:#e5e5e5}*{box-sizing:border-box}body{margin:0;background:var(--light);font-family:Arial,sans-serif;color:#111}header{padding:17px 28px;background:#fff;border-bottom:3px solid var(--red)}h1{margin:0;font-size:22px;letter-spacing:1px}header p{margin:4px 0 0;color:var(--red);font-size:10px;font-weight:bold;letter-spacing:1px}main{width:min(1400px,calc(100% - 28px));margin:22px auto}.card{margin:16px 0;overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:13px;box-shadow:0 4px 18px #0000000c}.title{padding:16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:bold}.warn{padding:13px 15px;color:white;background:#af1111;border:1px solid var(--red);border-radius:10px;font-size:13px;line-height:1.45}.hide{display:none}#map{height:500px}.controls{display:flex;gap:8px;align-items:center;padding:12px;border-top:1px solid var(--border)}button{padding:8px 11px;background:#fff;border:1px solid #ddd;border-radius:7px;font-weight:bold;cursor:pointer}.play{color:#fff;background:var(--red);border-color:var(--red)}#time{margin-left:auto;font-size:11px}.forecast{display:flex;overflow-x:auto}.day{min-width:145px;min-height:145px;padding:15px;text-align:center;border-right:1px solid #eee}.day b{display:block;font-size:12px}.temp{margin:12px 0 5px;font-size:24px;font-weight:bold}.text{color:#777;font-size:10px;line-height:1.35}.badge{display:inline-block;margin-top:7px;padding:3px 6px;color:#fff;background:var(--red);border-radius:4px;font-size:8px;font-weight:bold;letter-spacing:.4px}.empty{padding:24px;color:#777;text-align:center;font-size:12px}@media(max-width:600px){main{width:calc(100% - 18px)}#map{height:400px}header{padding:15px}}
  </style>
</head>
<body>
  <header><h1>STORMSIGNAL</h1><p>CHAMINADE • ST. LOUIS</p></header>
  <main>
    <div class="warn hide" id="warn"></div>
    <section class="card"><div class="title">📡 LIVE RADAR</div><div id="map"></div><div class="controls"><button id="prev">‹</button><button class="play" id="play">▶ Play</button><button id="next">›</button><button id="latest">Latest</button><span id="time">Loading…</span></div></section>
    <section class="card"><div class="title">🌦️ 7-DAY FORECAST</div><div class="forecast" id="forecast"><div class="empty">Loading forecast...</div></div></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig={apiKey:"AIzaSyAJ4vOeQrUDY1f9O3-3zGF1oCgptP7ePQw",authDomain:"stormsignal-premium.firebaseapp.com",projectId:"stormsignal-premium",storageBucket:"stormsignal-premium.firebasestorage.app",messagingSenderId:"104140219197",appId:"1:104140219197:web:6cb2a20673130ae48c5b54",measurementId:"G-YNHX5T9C1G"};
    const db=getFirestore(initializeApp(firebaseConfig)),warnRef=doc(db,"public_status","chamiwarn");
    const LAT=38.6273,LON=-90.339;let warn=null,frames=[],host="",idx=0,layer,timer,playing=false;
    const map=L.map("map",{center:[LAT,LON],zoom:9,minZoom:7,maxZoom:10});
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:10,attribution:"© OpenStreetMap contributors"}).addTo(map);
    map.createPane("radar");map.getPane("radar").style.zIndex=350;map.getPane("radar").style.pointerEvents="none";L.marker([LAT,LON]).addTo(map).bindPopup("<b>Chaminade</b>");
    const $=id=>document.getElementById(id);
    function icon(t){t=(t||"").toLowerCase();return t.includes("thunder")?"⛈️":t.includes("snow")?"❄️":t.includes("rain")||t.includes("shower")?"🌧️":t.includes("cloud")?"☁️":t.includes("clear")||t.includes("sunny")?"☀️":"🌤️"}
    function show(){if(layer)map.removeLayer(layer);let f=frames[idx];layer=L.tileLayer(`${host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,{pane:"radar",opacity:.8,maxZoom:10,maxNativeZoom:7,attribution:"Radar © RainViewer"}).addTo(map);$("time").textContent=new Date(f.time*1000).toLocaleString([],{weekday:"short",hour:"numeric",minute:"2-digit"})}
    async function radar(){try{let r=await fetch("https://api.rainviewer.com/public/weather-maps.json",{cache:"no-store"}),d=await r.json();if(!r.ok||!d.host||!d.radar?.past?.length)throw Error("Radar unavailable");host=d.host.replace(/\/$/,"");frames=d.radar.past;idx=frames.length-1;show()}catch(e){console.error("Radar error",e);$("time").textContent="Radar temporarily unavailable"}}
    function pause(){playing=false;$("play").textContent="▶ Play";clearInterval(timer);timer=null}
    $("play").onclick=()=>{if(!frames.length)return;if(playing)return pause();playing=true;$("play").textContent="❚❚ Pause";timer=setInterval(()=>{idx=(idx+1)%frames.length;show()},700)};
    $("prev").onclick=()=>{if(frames.length){pause();idx=(idx-1+frames.length)%frames.length;show()}};$("next").onclick=()=>{if(frames.length){pause();idx=(idx+1)%frames.length;show()}};$("latest").onclick=()=>{if(frames.length){pause();idx=frames.length-1;show()}};
    function renderWarn(){let b=$("warn");if(!warn?.active){b.classList.add("hide");return}b.innerHTML=`<b>CHAMI${warn.level} DAY — ${warn.alertDate}</b><br>${warn.headline}${warn.details?`<br>${warn.details}`:""}<br><small>Unofficial StormSignal informational status. Follow official NWS alerts and Chaminade guidance.</small>`;b.classList.remove("hide")}
    async function forecast(){try{let p=await(await fetch(`https://api.weather.gov/points/${LAT},${LON}`,{headers:{Accept:"application/geo+json"}})).json(),f=await(await fetch(p.properties.forecast,{headers:{Accept:"application/geo+json"}})).json(),days=f.properties.periods.filter(x=>x.isDaytime).slice(0,7),c=$("forecast");c.innerHTML="";days.forEach(x=>{let date=x.startTime.slice(0,10),match=warn&&warn.active&&warn.alertDate===date,d=document.createElement("div");d.className="day";d.innerHTML=`<b>${x.name}</b><div style="margin-top:10px;font-size:27px">${icon(x.shortForecast)}</div><div class="temp">${x.temperature ?? "--"}°</div><div class="text">${x.shortForecast||"Forecast unavailable"}</div>${match?`<span class="badge">CHAMI${warn.level}</span>`:""}`;c.appendChild(d)})}catch(e){console.error("Forecast error",e);$("forecast").innerHTML='<div class="empty">Forecast temporarily unavailable.</div>'}}
    onSnapshot(warnRef,s=>{warn=s.exists()?s.data():null;renderWarn();forecast()},e=>console.error("ChamiWARN read error",e));
    radar();forecast();setInterval(radar,600000);setInterval(forecast,300000);
  </script>
</body>
</html>
